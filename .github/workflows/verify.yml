name: Verify research deliverable
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/browser-qa/package-lock.json
      - name: Install pinned verification tools
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          npm ci --prefix tools/browser-qa --ignore-scripts
      - name: Rebuild evidence-driven site and test
        run: |
          .venv/bin/python scripts/build_site.py
          .venv/bin/python -m pytest -q
          .venv/bin/python scripts/check_site.py
          .venv/bin/python scripts/verify_project.py
      - name: Require the correct DO NOT SUBMIT exit status
        shell: bash
        run: |
          set +e
          .venv/bin/python scripts/submission_status.py
          code=$?
          test "$code" -eq 2
      - name: Check all pages in a real browser
        shell: bash
        run: |
          python -m http.server 8080 --bind 0.0.0.0 --directory docs > /tmp/g79-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/browser_review.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: software-verification-not-geological-scores
          path: |
            evidence/verification.json
            evidence/browser_review.json
            .cache/screenshots/*.png
          retention-days: 14
