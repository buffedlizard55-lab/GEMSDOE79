name: Pages and public-source health
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    outputs:
      source_attempt: ${{ steps.feed.outputs.attempted_utc }}
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned tools
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
      - name: Record actual public-source reachability
        id: feed
        run: |
          .venv/bin/python scripts/refresh_feed.py
          .venv/bin/python -c 'import json,os; d=json.load(open("docs/evidence/source_health.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("attempted_utc="+d["attempted_utc"]+"\n")'
      - name: Verify bytes and build static pages, never run an experiment
        run: |
          .venv/bin/python scripts/build_site.py
          .venv/bin/python scripts/check_site.py
          .venv/bin/python -m pytest -q
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Deploy the verified website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify publicly served pages, TIFF, ZIP and this exact feed
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_FEED_ATTEMPT: ${{ needs.build.outputs.source_attempt }}
        run: python3 scripts/verify_public_site.py --url "$PUBLIC_URL" --expected-feed-attempt "$EXPECTED_FEED_ATTEMPT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-pages-exact-byte-verification
          path: evidence/public_site_verification.json
          retention-days: 14
