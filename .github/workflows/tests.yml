name: Generic preflight compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -p test_validate_submission.py -v
      - run: python -m py_compile scripts/validate_submission.py tests/test_validate_submission.py
